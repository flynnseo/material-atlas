# 통제 어휘 + 동의어 사전
# 구조: <축>: { <정식태그>: [동의어, 은어, 오타, 영문, 약어 ...] }
# 검색은 동의어를 정식 태그로 바꿔서 찾는다 → "스뎅" 쳐도 stainless-steel 카드가 나온다.
# 새 태그는 여기 먼저 추가하고 카드에 쓴다. 동의어는 현장 용어·을지로 용어를 적극적으로 넣을 것.

family:
  metal: [금속, 메탈, 쇠, 철물]
  wood: [목재, 나무, 우드, 합판, 원목]
  stone: [석재, 돌, 스톤, 세라믹, 타일, 도자]
  polymer: [플라스틱, 수지, 폴리머, 레진, 합성수지]
  glass: [유리, 글라스, 글래스]
  textile: [섬유, 원단, 패브릭, 가죽, 레더]
  film: [필름, 시트, 코팅, 데코시트]
  light: [조명, 광원, 라이트, 빛]
  composite: [복합재, 복합소재, 신소재, 컴포지트]

subfamily:
  aluminium: [알루미늄, 알미늄, 알루미, 알루, aluminum, al, 알미]
  stainless-steel: [스테인리스, 스테인레스, 스텐, 스뎅, 서스, sus, sts, 스틸]
  steel: [철, 강철, 연강, 철판, 각파이프, ss400]
  brass: [황동, 신주, 브라스]
  copper: [구리, 동, 카파]
  titanium: [티타늄, 티탄]
  acrylic: [아크릴, pmma, 플렉시, 플렉시글라스, plexiglass, 아크릴판, 캐스트아크릴]
  polycarbonate: [폴리카보네이트, 폴리카, pc, 렉산]
  epoxy-resin: [에폭시, 에폭시레진, 레진아트]
  silicone: [실리콘, 실리콘고무, rtv]
  plywood: [합판, 자작합판, 자작나무합판, 플라이우드]
  mdf: [엠디에프, 중밀도섬유판]

look:
  matte: [무광, 매트, 저광, 무광택, 반무광]
  glossy: [유광, 광택, 하이글로시, 고광택, 글로시]
  mirror: [거울, 미러, 경면, 경면연마, 미러폴리싱]
  metallic: [메탈릭, 금속감, 금속광택]
  transparent: [투명, 클리어, 클리어한, 비치는]
  translucent: [반투명, 유백, 젖빛, 오팔]
  textured: [질감, 텍스처, 거친, 요철]
  brushed: [헤어라인, 브러시드, 결무늬, 결]
  warm: [따뜻한, 웜톤]
  cool: [차가운, 쿨톤, 차가움]
  iridescent: [오로라, 무지개, 이리데센트, 홀로그램, 디크로익]

processes:
  cnc: [씨엔씨, 가공, 밀링, 라우터, cnc가공]
  laser-cut: [레이저, 레이저커팅, 레이저컷, 레이저절단]
  waterjet: [워터젯, 수압절단]
  bending: [절곡, 벤딩, 밴딩, 꺾기]
  welding-tig: [티그, 알곤용접, tig, 알곤]
  welding: [용접, 웰딩]
  casting: [주조, 캐스팅, 주물]
  molding: [몰딩, 성형, 사출, 진공성형]
  3d-print: [3d프린팅, 3d프린트, 출력, 프린팅]
  thermoforming: [열성형, 열가공, 벤딩히터]
  polishing: [연마, 폴리싱, 광내기, 버핑]
  bonding: [접착, 본딩, 붙이기]

uses:
  facade: [파사드, 외장, 외벽, 익스테리어]
  wall: [벽, 벽체, 월, 벽면]
  ceiling: [천장, 천정, 실링]
  floor: [바닥, 플로어, 바닥재]
  fixture: [집기, 선반, 카운터, 매대, 쇼케이스, 진열대]
  object: [오브제, 디스플레이, 조형물, 소품]
  kinetic: [키네틱, 움직이는, 구동, 회전]
  installation: [설치, 설치작품, 인스톨레이션]
  lighting: [조명기구, 라이팅]
  signage: [사인, 사이니지, 간판, vmd]
  outdoor: [야외, 실외, 외부, 아웃도어]
  indoor: [실내, 내부, 인도어]

form:
  sheet: [판재, 판, 시트, 플레이트, 철판]
  bar: [환봉, 각봉, 봉재, 바]
  tube: [파이프, 관, 튜브, 각관]
  profile: [프로파일, 압출재, 앵글, 채널]
  block: [블록, 덩어리, 괴]
  liquid: [액상, 주제, 경화제]

# 신소재 레이더 축 (카드의 maturity / availability_kr 값 = 태그)
maturity:
  lab: [연구단계, 연구실, 실험실, 랩, 논문]
  prototype: [시제품, 프로토타입, 파일럿, 시범]
  commercial: [상용, 상용화, 판매중, 구매가능]
  mainstream: [보편, 대중화, 흔한, 일반화]

availability_kr:
  none: [국내없음, 수급불가, 구하기어려운]
  import: [수입, 직수입, 해외구매, 해외직구]
  distributor: [국내대리점, 대리점, 총판, 국내유통]
  local: [국내생산, 국산, 국내제조, 을지로]
